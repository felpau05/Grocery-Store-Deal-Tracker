<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Watermelon Hero</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #fff3c4 0%, #ffd66b 35%, #ff9f4a 70%, #ff6b6b 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #canvas-wrap { width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #canvas-wrap.dragging { cursor: grabbing; }
  .ui-group {
    position: absolute;
    display: flex;
    gap: 10px;
  }
  #ui-bottom {
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
  }
  #ui-left {
    left: 26px;
    top: 50%;
    transform: translateY(-50%);
    flex-direction: column;
  }
  #ui-right {
    right: 26px;
    top: 50%;
    transform: translateY(-50%);
    flex-direction: column;
  }
  .ui-group button {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(120, 60, 20, 0.3);
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #6b3a12;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .ui-group button:hover { background: rgba(255, 255, 255, 0.65); }
  #ui-top {
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
  }
  .ui-group button:active { transform: scale(0.92); }
  .fruit-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.1s, border-color 0.15s;
  }
  .fruit-btn:hover { transform: scale(1.08); }
  .fruit-btn.active { border-color: #6b3a12; }

  /* Back to the deals app. Top-left: #ui-top is centred, so this corner
     stays clear at any width. Same glass treatment as the controls. */
  #back-link {
    position: absolute;
    top: 26px;
    left: 26px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 999px;
    border: 1px solid rgba(120, 60, 20, 0.3);
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #6b3a12;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    z-index: 10;
    transition: background 0.15s, transform 0.1s;
  }
  #back-link:hover { background: rgba(255, 255, 255, 0.65); }
  #back-link:active { transform: scale(0.96); }

  /* ── Embedded preview mode ──────────────────────────────────────
     Same scene as the full toy, reduced to a non-interactive loop:
     all controls hidden (.ui-group covers the fruit picker too),
     pointer events off so clicks reach the parent link. */
  .ui-group, #back-link { display: none !important; }
  #canvas-wrap { pointer-events: none !important; cursor: default !important; }
  html, body { overflow: hidden; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<a id="back-link" href="/">&#8592;&nbsp;Back to deals</a>
<div class="ui-group" id="ui-top">
  <button class="fruit-btn active" id="fruit-watermelon" title="Watermelon" style="background:#e6f5c9;color:#1f6b2e;">W</button>
  <button class="fruit-btn" id="fruit-orange" title="Orange" style="background:#ffdca3;color:#c05a00;">O</button>
  <button class="fruit-btn" id="fruit-kiwi" title="Kiwi" style="background:#dff0b8;color:#4a3a1a;">K</button>
  <button class="fruit-btn" id="fruit-dragonfruit" title="Dragon fruit" style="background:#ffd6ec;color:#a3125e;">D</button>
  <button class="fruit-btn" id="fruit-lime" title="Lime" style="background:#d4f0a0;color:#3d6b12;">L</button>
  <button class="fruit-btn" id="fruit-peach" title="Peach" style="background:#ffd9b0;color:#c0501a;">P</button>
</div>
<div class="ui-group" id="ui-left">
  <button id="spin-left" title="Spin faster left">&#9664;</button>
  <button id="pause" title="Pause rotation">&#10074;&#10074;</button>
  <button id="spin-right" title="Spin faster right">&#9654;</button>
</div>
<div class="ui-group" id="ui-right">
  <button id="zoom-in" title="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out">&minus;</button>
  <button id="spread" title="Spread pieces apart">&#10530;</button>
  <button id="gather" title="Gather pieces closer">&#10529;</button>
</div>
<div class="ui-group" id="ui-bottom">
  <button id="drop" title="Drop everything">&#8595;</button>
  <button id="undo" title="Undo last slice">&#8630;</button>
  <button id="reset" title="Reset">&#8634;</button>
</div>

<!-- Self-hosted: the CDN copy cost a cold visitor a DNS lookup and a TLS
     handshake to a third-party origin before 600KB even started moving,
     all of it on the critical path to the hero intro. Same origin means
     it rides the connection the page already has. Pinned filename so it
     can be cached hard. -->
<script src="/vendor/three.r128.min.js"></script>
<script>
(function() {

  /* ============================================================
     TUNING PARAMETERS — edit these to change the feel
     ============================================================ */
  const CONFIG = {
    // How strongly a drag spins the melon. LOWER = feels heavier /
    // harder to get spinning. (try 0.002 for very heavy, 0.01 for light)
    DRAG_SENSITIVITY: 0.0038,

    // Momentum retention per frame after release. HIGHER = spins longer.
    INERTIA_DECAY: 0.995,

    // Same two knobs but for rotating an individual piece in place.
    PIECE_DRAG_SENSITIVITY: 0.006,
    PIECE_INERTIA_DECAY: 0.992,

    // How much each ◀ / ▶ button press changes the idle spin (rad/s).
    SPIN_STEP: 0.18,
    SPIN_MAX: 1.6,

    // Gap pieces move apart when sliced.
    SLICE_GAP: 0.85,

    // Gravity strength, floor height, max throw speed, camera orbit feel.
    GRAVITY: 13,
    FLOOR_Y: -2.2,
    THROW_MAX: 14,
    ORBIT_SENSITIVITY: 0.005,

    // Arena bounds: pieces can't leave this cylinder.
    WORLD_RADIUS: 7.5,
    CEILING_Y: 15,

    // Extra clearance kept between a piece's collider and the floor plane,
    // so the visual mesh (which the sphere colliders only approximate)
    // never dips through the floor even at odd rotations.
    FLOOR_MARGIN: 0.06,

    // How far each spread/gather button press moves pieces out/in,
    // and the closest a piece may be pulled toward the center.
    SPREAD_STEP: 0.45,
    GATHER_MIN: 0.4
  };
  /* ============================================================ */

  const wrapEl = document.getElementById('canvas-wrap');
  const R = 1.5;
  const WEDGES = 8;

  const CENTROID = { 8: 0, 4: 0.5625, 2: 0.72, 1: 0.84 };
  const BOUND_R = { 8: 1.5, 4: 1.2, 2: 0.95, 1: 0.75 };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function blob(ctx, x, y, size, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    const lobes = 3 + Math.floor(rand(0, 3));
    for (let l = 0; l < lobes; l++) {
      ctx.beginPath();
      ctx.ellipse(
        x + rand(-size * 0.4, size * 0.4),
        y + rand(-size * 0.4, size * 0.4),
        size * rand(0.45, 0.8), size * rand(0.35, 0.65),
        rand(0, Math.PI), 0, Math.PI * 2
      );
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function seed(ctx, x, y, ang, len, wid, dark, darkCol, liteCol) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0, 0, wid, len, 0, 0, Math.PI * 2);
    ctx.fillStyle = dark ? (darkCol || '#2b1508') : (liteCol || '#efe0c4');
    ctx.fill();
    if (dark) {
      ctx.strokeStyle = '#180b03';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(-wid * 0.25, -len * 0.45, wid * 0.3, len * 0.22, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- Watermelon ----------
  function drawWatermelonRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#12310f');
    grad.addColorStop(0.5, '#0e2a0e');
    grad.addColorStop(1, '#123512');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const bands = 8;
    const spacing = w / bands;
    const greens = ['#5cb43e', '#74cc4a', '#8fdf58', '#4da337', '#a4e968'];

    for (let i = 0; i < bands; i++) {
      const baseX = (i + 0.5) * spacing;
      const ph = rand(0, 6.28);
      for (let b = 0; b < 90; b++) {
        const y = rand(0, h);
        const wob = Math.sin(y * 0.006 + ph) * 40;
        const x = baseX + wob + rand(-58, 58);
        const col = greens[Math.floor(rand(0, greens.length))];
        blob(ctx, x, y, rand(14, 46), col, rand(0.55, 0.95));
      }
      for (let b = 0; b < 40; b++) {
        const y = rand(0, h);
        const wob = Math.sin(y * 0.006 + ph) * 40;
        blob(ctx, baseX + wob + rand(-40, 40), y, rand(4, 12), '#b8f07a', rand(0.4, 0.8));
      }
    }

    for (let b = 0; b < 260; b++) {
      blob(ctx, rand(0, w), rand(0, h), rand(3, 10), '#3f8f31', rand(0.25, 0.55));
    }

    for (let i = 0; i < 2600; i++) {
      const dark = Math.random() > 0.5;
      ctx.fillStyle = dark ? 'rgba(6,22,7,0.2)' : 'rgba(180,235,120,0.14)';
      ctx.beginPath();
      ctx.arc(rand(0, w), rand(0, h), rand(0.6, 2), 0, Math.PI * 2);
      ctx.fill();
    }

    const burstH = 130;
    for (let i = 0; i < 90; i++) {
      const x = rand(0, w);
      const bh = rand(burstH * 0.35, burstH);
      const g = ctx.createLinearGradient(0, h - bh, 0, h);
      g.addColorStop(0, 'rgba(226,224,120,0)');
      g.addColorStop(1, 'rgba(233,228,128,' + rand(0.35, 0.75) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(x, h - bh, rand(8, 26), bh);
    }
    const sg = ctx.createLinearGradient(0, h - 46, 0, h);
    sg.addColorStop(0, 'rgba(210,205,110,0)');
    sg.addColorStop(1, 'rgba(222,214,118,0.55)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, h - 46, w, 46);
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(0, h - 13, w, 13);
    ctx.fillStyle = '#3d2916';
    ctx.fillRect(0, h - 6, w, 6);

    ctx.fillStyle = '#7a5a36';
    ctx.fillRect(0, 0, w, 8);
    ctx.fillStyle = 'rgba(190,200,110,0.4)';
    ctx.fillRect(0, 8, w, 14);
  }

  function drawWatermelonFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#144a17';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4fb43e';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.968, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8ec8f';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.947, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f6fbe4';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.93, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, r * 0.04, cx, cy, r * 0.912);
    fg.addColorStop(0, '#ff8a8c');
    fg.addColorStop(0.35, '#ff4f5e');
    fg.addColorStop(0.85, '#f7203b');
    fg.addColorStop(0.97, '#ff9285');
    fg.addColorStop(1, '#f9e4d1');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.912, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 150; i++) {
      const a = rand(0, Math.PI * 2);
      const r0 = r * rand(0.05, 0.2);
      const r1 = r * rand(0.45, 0.84);
      const bend = rand(-0.12, 0.12);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.quadraticCurveTo(
        cx + Math.cos(a + bend) * (r0 + r1) * 0.5,
        cy + Math.sin(a + bend) * (r0 + r1) * 0.5,
        cx + Math.cos(a) * r1, cy + Math.sin(a) * r1
      );
      const light = Math.random() > 0.5;
      ctx.strokeStyle = light ? 'rgba(255,150,150,0.18)' : 'rgba(215,20,45,0.18)';
      ctx.lineWidth = rand(2, 6);
      ctx.stroke();
    }

    for (let i = 0; i < 14; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.15, 0.6);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      const rad = r * rand(0.05, 0.13);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(255,255,255,0.12)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.34, 0.7);
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, a + Math.PI / 2 + rand(-0.25, 0.25), rand(12, 16), rand(6.5, 8.5), true);
    }
    for (let i = 0; i < 12; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.12, 0.5);
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, a + Math.PI / 2 + rand(-0.3, 0.3), rand(8, 11), rand(4.5, 6), false);
    }
  }

  // ---------- Orange ----------
  function drawOrangeRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#ffb545');
    grad.addColorStop(0.5, '#ff9a1f');
    grad.addColorStop(1, '#f2800a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 90; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(60, 200);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const light = Math.random() > 0.5;
      g.addColorStop(0, light ? 'rgba(255,220,150,0.18)' : 'rgba(200,100,10,0.14)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 6000; i++) {
      const x = rand(0, w), y = rand(0, h);
      const dark = Math.random() > 0.5;
      ctx.fillStyle = dark ? 'rgba(150,70,5,0.35)' : 'rgba(255,235,180,0.3)';
      ctx.beginPath();
      ctx.arc(x, y, rand(1.2, 3.2), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(90,50,10,0.5)';
    for (let i = 0; i < 30; i++) {
      ctx.beginPath();
      ctx.arc(rand(0, w), h - rand(0, 40), rand(3, 7), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOrangeFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#ffcf7a';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe6b0';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.94, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.9);
    fg.addColorStop(0, '#ffcf6a');
    fg.addColorStop(0.6, '#ffb84a');
    fg.addColorStop(1, '#ff9e2a');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.fill();

    const segs = 11;
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * Math.PI * 2 + rand(-0.02, 0.02);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9);
      ctx.strokeStyle = 'rgba(255,245,220,0.55)';
      ctx.lineWidth = rand(3, 5);
      ctx.stroke();

      const mid = a + (Math.PI * 2 / segs) / 2;
      for (let j = 0; j < 40; j++) {
        const rr = rand(0.05, 0.88) * r * 0.9;
        const spread = rand(-0.32, 0.32) * (Math.PI * 2 / segs);
        const x = cx + Math.cos(mid + spread) * rr;
        const y = cy + Math.sin(mid + spread) * rr;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,240,200,0.4)' : 'rgba(255,150,40,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y, rand(3, 7), rand(6, 14), mid, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 3; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.1, 0.6);
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, a, 10, 4.5, false, null, '#f4ecd2');
    }
  }

  // ---------- Kiwi ----------
  function drawKiwiRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#a9834a');
    grad.addColorStop(0.5, '#8c6a38');
    grad.addColorStop(1, '#6e5228');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 140; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(30, 110);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const light = Math.random() > 0.5;
      g.addColorStop(0, light ? 'rgba(190,160,100,0.22)' : 'rgba(70,50,20,0.2)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 9000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(230,210,160,0.16)' : 'rgba(50,35,15,0.18)';
      ctx.beginPath();
      ctx.arc(rand(0, w), rand(0, h), rand(0.6, 1.8), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawKiwiFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#5a3a1e';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e7f2c8';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.97, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, r * 0.08, cx, cy, r * 0.94);
    fg.addColorStop(0, '#f4f7d8');
    fg.addColorStop(0.35, '#c7e56a');
    fg.addColorStop(0.75, '#8dc93f');
    fg.addColorStop(1, '#e7f2c8');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.94, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f7fae3';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.09, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 220; i++) {
      const a = rand(0, Math.PI * 2);
      const r0 = r * rand(0.1, 0.25);
      const r1 = r * rand(0.5, 0.92);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,230,0.15)' : 'rgba(70,110,20,0.14)';
      ctx.lineWidth = rand(1, 3);
      ctx.stroke();
    }

    const ringR = r * 0.62;
    const seedCount = 34;
    for (let i = 0; i < seedCount; i++) {
      const a = (i / seedCount) * Math.PI * 2 + rand(-0.03, 0.03);
      const rr = ringR + rand(-6, 6);
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, a + Math.PI / 2, 8, 3.4, true, '#241608', null);
    }
  }

  // ---------- Dragon fruit ----------
  function drawDragonRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#ff4fa0');
    grad.addColorStop(0.5, '#ee2b84');
    grad.addColorStop(1, '#c81368');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 70; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(50, 170);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const light = Math.random() > 0.5;
      g.addColorStop(0, light ? 'rgba(255,170,215,0.22)' : 'rgba(140,10,70,0.2)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 34; i++) {
      const x = rand(0, w), y = rand(h * 0.1, h * 0.9);
      const len = rand(30, 60);
      const ang = rand(-0.4, 0.4);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, -len * 0.5);
      ctx.quadraticCurveTo(len * 0.35, 0, 0, len * 0.5);
      ctx.quadraticCurveTo(-len * 0.35, 0, 0, -len * 0.5);
      ctx.fillStyle = '#3fae4c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(30,90,35,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    for (let i = 0; i < 3000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,220,235,0.12)' : 'rgba(90,5,45,0.15)';
      ctx.beginPath();
      ctx.arc(rand(0, w), rand(0, h), rand(0.6, 1.8), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawDragonFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#3fae4c';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9f4';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.94, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.92);
    fg.addColorStop(0, '#ffffff');
    fg.addColorStop(0.7, '#fdf7fa');
    fg.addColorStop(1, '#ffe9f4');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 40; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.1, 0.75);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      const rad = r * rand(0.04, 0.1);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(255,120,190,0.1)');
      g.addColorStop(1, 'rgba(255,120,190,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 340; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = Math.sqrt(rand(0, 1)) * r * 0.86;
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, rand(0, Math.PI), rand(3.5, 5.5), rand(1.6, 2.4), true, '#1c1108', null);
    }
  }

  // ---------- Lime ----------
  function drawLimeRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#8fd93f');
    grad.addColorStop(0.5, '#6cc02a');
    grad.addColorStop(1, '#4a9e1c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 90; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(60, 200);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const light = Math.random() > 0.5;
      g.addColorStop(0, light ? 'rgba(220,255,170,0.2)' : 'rgba(30,90,10,0.16)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 6500; i++) {
      const dark = Math.random() > 0.5;
      ctx.fillStyle = dark ? 'rgba(30,80,10,0.32)' : 'rgba(230,255,190,0.28)';
      ctx.beginPath();
      ctx.arc(rand(0, w), rand(0, h), rand(1.2, 3), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,240,180,0.35)';
    for (let i = 0; i < 26; i++) {
      ctx.beginPath();
      ctx.arc(rand(0, w), h - rand(0, 34), rand(3, 6), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLimeFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#c8e88a';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e6f3bf';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.94, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.9);
    fg.addColorStop(0, '#e9f3a8');
    fg.addColorStop(0.6, '#cfe872');
    fg.addColorStop(1, '#a8d94a');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.fill();

    const segs = 10;
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * Math.PI * 2 + rand(-0.02, 0.02);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r * 0.9, cy + Math.sin(a) * r * 0.9);
      ctx.strokeStyle = 'rgba(250,255,225,0.6)';
      ctx.lineWidth = rand(3, 5);
      ctx.stroke();

      const mid = a + (Math.PI * 2 / segs) / 2;
      for (let j = 0; j < 40; j++) {
        const rr = rand(0.05, 0.88) * r * 0.9;
        const spread = rand(-0.32, 0.32) * (Math.PI * 2 / segs);
        const x = cx + Math.cos(mid + spread) * rr;
        const y = cy + Math.sin(mid + spread) * rr;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(245,255,220,0.4)' : 'rgba(140,200,50,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y, rand(3, 7), rand(6, 14), mid, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 4; i++) {
      const a = rand(0, Math.PI * 2);
      const rr = r * rand(0.1, 0.6);
      seed(ctx, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, a, 9, 4, false, null, '#f2f6d8');
    }
  }

  // ---------- Peach ----------
  function drawPeachRind(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#ffcf7f');
    grad.addColorStop(0.5, '#ffb257');
    grad.addColorStop(1, '#f28c3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 60; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(70, 220);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(230,60,60,0.32)');
      g.addColorStop(1, 'rgba(230,60,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 40; i++) {
      const x = rand(0, w), y = rand(0, h), r = rand(40, 120);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,235,180,0.3)');
      g.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.globalAlpha = 0.18;
    for (let i = 0; i < 14000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#fff3d8' : '#c9601f';
      ctx.fillRect(rand(0, w), rand(0, h), 1, rand(1.5, 4));
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(190,70,20,0.45)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(w * 0.08, 0);
    for (let y = 0; y <= h; y += h / 30) {
      ctx.lineTo(w * 0.08 + Math.sin(y * 0.05) * 10, y);
    }
    ctx.stroke();
  }

  function drawPeachFlesh(ctx, s) {
    const cx = s / 2, cy = s / 2, r = s / 2;

    ctx.fillStyle = '#c0401f';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd79a';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.96, 0, Math.PI * 2); ctx.fill();

    const fg = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 0.93);
    fg.addColorStop(0, '#ffedbe');
    fg.addColorStop(0.55, '#ffcf7d');
    fg.addColorStop(1, '#ffa84e');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.93, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 160; i++) {
      const a = rand(0, Math.PI * 2);
      const r0 = r * rand(0.24, 0.32);
      const r1 = r * rand(0.55, 0.88);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,240,200,0.22)' : 'rgba(210,110,30,0.2)';
      ctx.lineWidth = rand(1.5, 4);
      ctx.stroke();
    }

    const pitR = r * 0.22;
    const pg = ctx.createRadialGradient(cx, cy, 0, cx, cy, pitR);
    pg.addColorStop(0, '#a8401c');
    pg.addColorStop(1, '#5e2a10');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(cx, cy, pitR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(60,20,5,0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * pitR * 0.3, cy + Math.sin(a) * pitR * 0.3);
      ctx.lineTo(cx + Math.cos(a) * pitR * 0.95, cy + Math.sin(a) * pitR * 0.95);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(150,50,20,0.5)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, cy, pitR * 1.15, 0, Math.PI * 2); ctx.stroke();
  }
  const FRUITS = {
    watermelon: { label: 'Watermelon', rind: drawWatermelonRind, flesh: drawWatermelonFlesh },
    orange: { label: 'Orange', rind: drawOrangeRind, flesh: drawOrangeFlesh },
    kiwi: { label: 'Kiwi', rind: drawKiwiRind, flesh: drawKiwiFlesh },
    dragonfruit: { label: 'Dragon fruit', rind: drawDragonRind, flesh: drawDragonFlesh },
    lime: { label: 'Lime', rind: drawLimeRind, flesh: drawLimeFlesh },
    peach: { label: 'Peach', rind: drawPeachRind, flesh: drawPeachFlesh }
  };
  let currentFruit = 'watermelon';


  function makeEnvMap() {
    function face(stops, blob) {
      const s = 128;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, s);
      for (const [o, col] of stops) g.addColorStop(o, col);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
      if (blob) {
        const rg = ctx.createRadialGradient(s * 0.5, s * 0.35, 0, s * 0.5, s * 0.35, s * 0.42);
        rg.addColorStop(0, 'rgba(255,255,255,0.95)');
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, s, s);
      }
      return c;
    }
    const side = [[0, '#fff2c8'], [0.6, '#ffcf7d'], [1, '#ff9d5e']];
    const tex = new THREE.CubeTexture([
      face(side, true),
      face(side, false),
      face([[0, '#fffbe8'], [1, '#ffe9a8']], false),
      face([[0, '#ff9d5e'], [1, '#ff7a60']], false),
      face(side, false),
      face(side, false)
    ]);
    tex.needsUpdate = true;
    return tex;
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, wrapEl.clientWidth / wrapEl.clientHeight, 0.1, 100);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(wrapEl.clientWidth, wrapEl.clientHeight);
  wrapEl.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.05);
  keyLight.position.set(3, 4, 5);
  scene.add(keyLight);
  const rim = new THREE.DirectionalLight(0xffd9a0, 0.55);
  rim.position.set(-4, -2, -3);
  scene.add(rim);

  const envMap = makeEnvMap();

  // Shared, repaintable canvases: switching fruit just redraws these and
  // flags the textures dirty, instead of rebuilding meshes/materials.
  /* Sized for the 150px corner preview, not the full-screen toy:
     8MB of rind and 4MB of flesh for a thumbnail was the single
     biggest allocation on every page in the app.

     512 is matched to that box specifically: a sphere's visible face
     spans half the rind's width, so only RIND_W/2 texels stretch across
     the melon's diameter — 256 over ~260 device pixels at 2x DPR, about
     1:1. Grow the box past ~150px and this wants to go up with it or the
     melon goes soft. */
  const RIND_W = 512, RIND_H = 256, FLESH_S = 256;
  /* The dimensions the FRUITS generators are actually written for —
     see drawScaled below for why they can't just be handed RIND_W. */
  const RIND_SRC_W = 2048, RIND_SRC_H = 1024, FLESH_SRC_S = 1024;
  const rindCanvasEl = document.createElement('canvas');
  rindCanvasEl.width = RIND_W; rindCanvasEl.height = RIND_H;
  const rindCtx = rindCanvasEl.getContext('2d');
  const fleshCanvasEl = document.createElement('canvas');
  fleshCanvasEl.width = FLESH_S; fleshCanvasEl.height = FLESH_S;
  const fleshCtx = fleshCanvasEl.getContext('2d');

  /* The FRUITS generators mix relative coordinates with ABSOLUTE pixel
     constants — blob radii of rand(14,46), a 40px stripe wobble, a
     130px burst height, seed bands at h-46/h-13 — all tuned against a
     2048x1024 rind. Hand them a 512x256 canvas and only half the
     drawing shrinks with it: the blobs stay their original size while
     the melon shrinks around them, so they overlap into a pale wash and
     the dark base disappears. (That's exactly what the shrunk preview
     looked like before this.)

     So draw at the size they expect and downsample once into the canvas
     we actually keep. The full-size scratch is local and collected
     right after — only the small canvas is retained and uploaded, which
     is where the memory saving was ever coming from. */
  function drawScaled(ctx, w, h, srcW, srcH, draw) {
    if (w === srcW && h === srcH) {
      draw(ctx, srcW, srcH);
      return;
    }
    const scratch = document.createElement('canvas');
    scratch.width = srcW; scratch.height = srcH;
    draw(scratch.getContext('2d'), srcW, srcH);
    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(scratch, 0, 0, w, h);
  }

  drawScaled(rindCtx, RIND_W, RIND_H, RIND_SRC_W, RIND_SRC_H, FRUITS[currentFruit].rind);
  drawScaled(fleshCtx, FLESH_S, FLESH_S, FLESH_SRC_S, FLESH_SRC_S, FRUITS[currentFruit].flesh);

  const fleshTex = new THREE.CanvasTexture(fleshCanvasEl);
  fleshTex.anisotropy = 4;
  const fleshMat = new THREE.MeshStandardMaterial({
    map: fleshTex, roughness: 0.62, metalness: 0, side: THREE.DoubleSide,
    envMap: envMap, envMapIntensity: 0.2
  });

  const cutFaceGeo = new THREE.CircleGeometry(R, 48, -Math.PI / 2, Math.PI);

  const melonGroup = new THREE.Group();
  scene.add(melonGroup);

  /* The one rind texture every wedge shares — see the loop below. */
  const rindTex = new THREE.CanvasTexture(rindCanvasEl);
  rindTex.wrapS = THREE.RepeatWrapping;
  rindTex.anisotropy = 4;

  const wedgeGroups = [];
  for (let i = 0; i < WEDGES; i++) {
    const p0 = i * (Math.PI * 2 / WEDGES);
    const len = Math.PI * 2 / WEDGES;

    /* One texture for all WEDGES wedges, not one apiece. Each wedge used
       to build its own CanvasTexture over this same canvas purely to set
       repeat.x/offset.x — but those are per-TEXTURE properties, so eight
       wedges meant eight separate uploads of identical 2048x1024 pixels
       (~85MB of VRAM once three.js built their mipmaps). The wedge's arc
       of the rind is baked into its UVs below instead, which is per-
       GEOMETRY, so the texture itself can be shared. */
    const rindMat = new THREE.MeshStandardMaterial({
      map: rindTex, roughness: 0.28, metalness: 0.02,
      bumpMap: rindTex, bumpScale: 0.01,
      envMap: envMap, envMapIntensity: 0.6
    });

    /* SphereGeometry hands every wedge a full 0..1 u range whatever its
       phiStart/phiLength, so slide that onto this wedge's own arc —
       exactly the mapping tex.offset.x/repeat.x used to apply. */
    const geo = new THREE.SphereGeometry(R, 32, 48, p0, len);
    const uv = geo.attributes.uv;
    const uOff = p0 / (Math.PI * 2);
    const uRep = len / (Math.PI * 2);
    for (let k = 0; k < uv.count; k++) uv.setX(k, uOff + uv.getX(k) * uRep);
    uv.needsUpdate = true;

    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, rindMat));

    const faceA = new THREE.Mesh(cutFaceGeo, fleshMat);
    faceA.rotation.y = Math.PI + p0;
    const faceB = new THREE.Mesh(cutFaceGeo, fleshMat);
    faceB.rotation.y = Math.PI + p0 + len;
    g.add(faceA, faceB);

    wedgeGroups.push(g);
  }

  function applyFruit(key) {
    if (key === currentFruit || !FRUITS[key]) return;
    currentFruit = key;
    if (gravityOn) liftAll();
    resetAll();
    drawScaled(rindCtx, RIND_W, RIND_H, RIND_SRC_W, RIND_SRC_H, FRUITS[key].rind);
    rindTex.needsUpdate = true;
    drawScaled(fleshCtx, FLESH_S, FLESH_S, FLESH_SRC_S, FLESH_SRC_S, FRUITS[key].flesh);
    fleshTex.needsUpdate = true;
    document.querySelectorAll('.fruit-btn').forEach((b) => b.classList.remove('active'));
    const btn = document.getElementById('fruit-' + key);
    if (btn) btn.classList.add('active');
  }

  Object.keys(FRUITS).forEach((key) => {
    const btn = document.getElementById('fruit-' + key);
    if (btn) btn.addEventListener('click', () => applyFruit(key));
  });

  const shadowTex = (function() {
    const s = 128;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(0,0,0,0.33)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(c);
  })();

  const shadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = CONFIG.FLOOR_Y - 0.04;
  shadowMesh.scale.set(4.2, 3.6, 1);
  shadowMesh.renderOrder = 2;
  scene.add(shadowMesh);

  // Visible floor disc with boundary ring (shown while gravity is on).
  const floorTex = (function() {
    const s = 256;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    const cx = s / 2, r = s / 2;
    const g = ctx.createRadialGradient(cx, cx, 0, cx, cx, r);
    g.addColorStop(0, 'rgba(255,246,220,0.95)');
    g.addColorStop(0.45, 'rgba(255,222,160,0.8)');
    g.addColorStop(0.8, 'rgba(255,198,130,0.45)');
    g.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cx, r, 0, Math.PI * 2); ctx.fill();

    /* Ring widths as fractions of s, not the flat 10/4 px they were:
       those were written against s=1024, so at this canvas's 256 they'd
       draw four times as thick relative to the disc. */
    ctx.strokeStyle = 'rgba(165,85,30,0.4)';
    ctx.lineWidth = s * (10 / 1024);
    ctx.beginPath(); ctx.arc(cx, cx, r * 0.9, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(165,85,30,0.15)';
    ctx.lineWidth = s * (4 / 1024);
    ctx.beginPath(); ctx.arc(cx, cx, r * 0.6, 0, Math.PI * 2); ctx.stroke();
    return new THREE.CanvasTexture(c);
  })();
  const floorMesh = new THREE.Mesh(
    new THREE.CircleGeometry(CONFIG.WORLD_RADIUS / 0.9, 64),
    new THREE.MeshBasicMaterial({ map: floorTex, transparent: true, opacity: 0, depthWrite: false })
  );
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.y = CONFIG.FLOOR_Y - 0.08;
  floorMesh.renderOrder = 1;
  floorMesh.visible = false;
  scene.add(floorMesh);

  function midDir(start, count) {
    const mid = (start + count / 2) * (Math.PI * 2 / WEDGES);
    return new THREE.Vector3(-Math.cos(mid), 0, Math.sin(mid));
  }

  function buildColliderSpheres(start, count, cNeg) {
    const d = midDir(start, count);
    const defs = [];
    function S(px, py, pz, r) {
      defs.push({ p: new THREE.Vector3(px, py, pz).add(cNeg), r });
    }
    if (count === 8) {
      S(0, 0, 0, R);
    } else if (count === 4) {
      S(d.x * 0.8, 0, d.z * 0.8, 0.92);
      S(d.x * 0.25, 0, d.z * 0.25, 0.8);
      S(d.x * 0.2, 0.85, d.z * 0.2, 0.52);
      S(d.x * 0.2, -0.85, d.z * 0.2, 0.52);
    } else if (count === 2) {
      S(d.x * 0.8, 0, d.z * 0.8, 0.62);
      S(d.x * 0.35, 0, d.z * 0.35, 0.5);
      S(d.x * 0.12, 0.9, d.z * 0.12, 0.4);
      S(d.x * 0.12, -0.9, d.z * 0.12, 0.4);
    } else {
      S(d.x * 0.9, 0, d.z * 0.9, 0.45);
      S(d.x * 0.45, 0, d.z * 0.45, 0.38);
      S(d.x * 0.08, 0.95, d.z * 0.08, 0.3);
      S(d.x * 0.08, -0.95, d.z * 0.08, 0.3);
    }
    return defs;
  }

  function makeCluster(start, count) {
    const group = new THREE.Group();
    const cNeg = midDir(start, count).multiplyScalar(-CENTROID[count]);
    for (let i = start; i < start + count; i++) {
      wedgeGroups[i].position.copy(cNeg);
      group.add(wedgeGroups[i]);
    }
    melonGroup.add(group);
    return {
      start, count, group, cNeg,
      colliders: buildColliderSpheres(start, count, cNeg),
      targetPos: new THREE.Vector3(),
      spinVel: new THREE.Vector2(),
      vel: new THREE.Vector3(),
      angVel: new THREE.Vector3(),
      settled: false,
      sibling: null,
      noCollideUntil: 0,
      shadow: null
    };
  }

  let clusters = [makeCluster(0, WEDGES)];
  const actions = [];
  const meshToCluster = new Map();
  let gravityOn = false;
  let grabbed = null;
  let simTime = 0;
  let dropStates = null;

  function rebuildMeshMap() {
    meshToCluster.clear();
    for (const cl of clusters) {
      cl.group.traverse((o) => { if (o.isMesh) meshToCluster.set(o, cl); });
    }
  }
  rebuildMeshMap();

  function splitCluster(cl) {
    if (cl.count < 2 || gravityOn) return;
    melonGroup.remove(cl.group);
    const half = cl.count / 2;
    const children = [];
    for (const s of [cl.start, cl.start + half]) {
      const child = makeCluster(s, half);
      child.group.quaternion.copy(cl.group.quaternion);
      const shift = child.cNeg.clone().sub(cl.cNeg).multiplyScalar(-1)
        .applyQuaternion(cl.group.quaternion);
      child.group.position.copy(cl.group.position).add(shift);
      child.targetPos.copy(child.group.position)
        .add(midDir(s, half).applyQuaternion(cl.group.quaternion).multiplyScalar(CONFIG.SLICE_GAP));
      children.push(child);
    }
    children[0].sibling = children[1];
    children[1].sibling = children[0];
    children[0].noCollideUntil = simTime + 0.5;
    children[1].noCollideUntil = simTime + 0.5;
    clusters = clusters.filter((c) => c !== cl).concat(children);
    actions.push({ type: 'slice', parent: cl, children });
    rebuildMeshMap();
  }

  const dropBtn = document.getElementById('drop');
  let camDipVel = 0, camDip = 0;

  function addShadows() {
    for (const cl of clusters) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.y = CONFIG.FLOOR_Y - 0.03;
      m.renderOrder = 2;
      scene.add(m);
      cl.shadow = m;
    }
  }

  function removeShadows() {
    for (const cl of clusters) {
      if (cl.shadow) { scene.remove(cl.shadow); cl.shadow = null; }
    }
  }

  function dropAll() {
    if (gravityOn) { liftAll(); return; }
    dropStates = [];
    for (const cl of clusters) {
      dropStates.push({
        cluster: cl,
        pos: cl.group.position.clone(),
        quat: cl.group.quaternion.clone()
      });
      scene.attach(cl.group);
      const out = cl.group.position.clone().setY(0);
      out.length() > 0.01 ? out.normalize() : out.set(rand(-1, 1), 0, rand(-1, 1)).normalize();
      cl.vel.copy(out.multiplyScalar(rand(0.6, 1.1)));
      cl.vel.y = rand(0.2, 0.7);
      cl.angVel.set(rand(-3, 3), rand(-3, 3), rand(-3, 3));
      cl.settled = false;
    }
    gravityOn = true;
    camDipVel = -4.5;
    addShadows();
    dropBtn.innerHTML = '&#8593;';
    dropBtn.title = 'Lift everything back up';
  }

  function liftAll() {
    if (!gravityOn || !dropStates) return;
    grabbed = null;
    removeShadows();
    for (const st of dropStates) {
      melonGroup.add(st.cluster.group);
      st.cluster.group.position.copy(st.pos);
      st.cluster.group.quaternion.copy(st.quat);
      st.cluster.targetPos.copy(st.pos);
      st.cluster.vel.set(0, 0, 0);
      st.cluster.angVel.set(0, 0, 0);
      st.cluster.settled = false;
    }
    dropStates = null;
    gravityOn = false;
    dropBtn.innerHTML = '&#8595;';
    dropBtn.title = 'Drop everything';
  }

  function undo() {
    if (gravityOn) return;
    const a = actions.pop();
    if (!a) return;
    for (const child of a.children) {
      melonGroup.remove(child.group);
      for (let i = child.start; i < child.start + child.count; i++) {
        wedgeGroups[i].position.copy(a.parent.cNeg);
        a.parent.group.add(wedgeGroups[i]);
      }
    }
    melonGroup.add(a.parent.group);
    clusters = clusters.filter((c) => !a.children.includes(c)).concat([a.parent]);
    rebuildMeshMap();
  }

  function resetAll() {
    if (gravityOn) liftAll();
    while (actions.length) undo();
    for (const cl of clusters) cl.spinVel.set(0, 0);
  }

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function setNdc(e) {
    const rect = wrapEl.getBoundingClientRect();
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  }

  function pickCluster(e) {
    setNdc(e);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects([...meshToCluster.keys()], false);
    if (!hits.length) return null;
    return { cluster: meshToCluster.get(hits[0].object), point: hits[0].point };
  }

  const tmpQ = new THREE.Quaternion();
  const tmpV = new THREE.Vector3();
  const tmpV2 = new THREE.Vector3();
  const tmpV3 = new THREE.Vector3();
  const WORLD_X = new THREE.Vector3(1, 0, 0);
  const WORLD_Y = new THREE.Vector3(0, 1, 0);
  const tumbleVel = new THREE.Vector2();
  let spinSpeed = 0.12;  // calmer than the full toy
  let rotationPaused = false;

  function applyTumble(rx, ry) {
    tmpQ.setFromAxisAngle(WORLD_Y, ry);
    melonGroup.quaternion.premultiply(tmpQ);
    tmpQ.setFromAxisAngle(WORLD_X, rx);
    melonGroup.quaternion.premultiply(tmpQ);
  }

  function rotateClusterScreen(cl, rx, ry) {
    tmpQ.copy(melonGroup.quaternion).invert();
    const axY = WORLD_Y.clone().applyQuaternion(tmpQ);
    const axX = WORLD_X.clone().applyQuaternion(tmpQ);
    const q = new THREE.Quaternion();
    q.setFromAxisAngle(axY, ry);
    cl.group.quaternion.premultiply(q);
    q.setFromAxisAngle(axX, rx);
    cl.group.quaternion.premultiply(q);
  }

  let dragMode = null;
  let moved = false;
  let lastX = 0, lastY = 0;
  let activeCluster = null;
  const grabPlane = new THREE.Plane();
  const throwVel = new THREE.Vector3();
  const lastGrabPoint = new THREE.Vector3();
  let lastGrabTime = 0;
  let camYaw = 0;
  let camPitch = 0.1;
  const BASE_PITCH = 0.1;
  let camLookY = 0;

  wrapEl.addEventListener('contextmenu', (e) => e.preventDefault());

  wrapEl.addEventListener('pointerdown', (e) => {
    moved = false;
    lastX = e.clientX; lastY = e.clientY;
    wrapEl.classList.add('dragging');
    wrapEl.setPointerCapture(e.pointerId);

    if (gravityOn) {
      const hit = pickCluster(e);
      if (hit) {
        grabbed = hit.cluster;
        grabbed.settled = false;
        camera.getWorldDirection(tmpV);
        grabPlane.setFromNormalAndCoplanarPoint(tmpV, grabbed.group.position);
        lastGrabPoint.copy(grabbed.group.position);
        lastGrabTime = performance.now();
        throwVel.set(0, 0, 0);
        dragMode = 'grab';
      } else {
        dragMode = 'orbit';
      }
      return;
    }

    const hit = pickCluster(e);
    if (hit && clusters.length > 1) {
      activeCluster = hit.cluster;
      dragMode = 'piece';
    } else {
      dragMode = 'tumble';
    }
  });

  wrapEl.addEventListener('pointermove', (e) => {
    if (!dragMode) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;

    if (dragMode === 'tumble') {
      applyTumble(dy * CONFIG.DRAG_SENSITIVITY, dx * CONFIG.DRAG_SENSITIVITY);
      tumbleVel.set(dy * CONFIG.DRAG_SENSITIVITY * 60, dx * CONFIG.DRAG_SENSITIVITY * 60);
    } else if (dragMode === 'piece' && activeCluster) {
      rotateClusterScreen(activeCluster, dy * CONFIG.PIECE_DRAG_SENSITIVITY, dx * CONFIG.PIECE_DRAG_SENSITIVITY);
      activeCluster.spinVel.set(
        dy * CONFIG.PIECE_DRAG_SENSITIVITY * 60,
        dx * CONFIG.PIECE_DRAG_SENSITIVITY * 60
      );
    } else if (dragMode === 'grab' && grabbed) {
      setNdc(e);
      raycaster.setFromCamera(ndc, camera);
      const pt = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(grabPlane, pt)) {
        const bound = BOUND_R[grabbed.count];
        pt.y = Math.max(pt.y, CONFIG.FLOOR_Y + 0.3);
        pt.y = Math.min(pt.y, CONFIG.CEILING_Y - bound);
        const horiz = Math.sqrt(pt.x * pt.x + pt.z * pt.z);
        const maxH = CONFIG.WORLD_RADIUS - bound;
        if (horiz > maxH) {
          pt.x *= maxH / horiz;
          pt.z *= maxH / horiz;
        }
        const now = performance.now();
        const gdt = Math.max((now - lastGrabTime) / 1000, 1e-3);
        const inst = pt.clone().sub(lastGrabPoint).divideScalar(gdt);
        throwVel.lerp(inst, 0.35);
        lastGrabPoint.copy(pt);
        lastGrabTime = now;
        grabbed.group.position.lerp(pt, 0.45);
        grabbed.vel.set(0, 0, 0);
      }
    } else if (dragMode === 'orbit') {
      camYaw -= dx * CONFIG.ORBIT_SENSITIVITY;
      camPitch = Math.max(0.02, Math.min(0.9, camPitch + dy * CONFIG.ORBIT_SENSITIVITY * 0.6));
    }
    lastX = e.clientX; lastY = e.clientY;
  });

  window.addEventListener('pointerup', (e) => {
    if (dragMode === 'grab' && grabbed) {
      if (throwVel.length() > CONFIG.THROW_MAX) {
        throwVel.setLength(CONFIG.THROW_MAX);
      }
      grabbed.vel.copy(throwVel);
      grabbed.angVel.set(rand(-2, 2), rand(-2, 2), rand(-2, 2)).multiplyScalar(Math.min(throwVel.length() / 4, 1));
      grabbed.settled = false;
      grabbed = null;
    } else if (dragMode && !moved && !gravityOn) {
      const hit = pickCluster(e);
      if (hit) splitCluster(hit.cluster);
    }
    dragMode = null;
    activeCluster = null;
    wrapEl.classList.remove('dragging');
  });

  let camDist = 7.6;
  let targetDist = 7.6;
  const MIN_DIST = 3.6, MAX_DIST = 30;

  document.getElementById('zoom-in').addEventListener('click', () => {
    targetDist = Math.max(MIN_DIST, targetDist - 1.1);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    targetDist = Math.min(MAX_DIST, targetDist + 1.1);
  });
  document.getElementById('spin-left').addEventListener('click', () => {
    spinSpeed = Math.max(-CONFIG.SPIN_MAX, spinSpeed - CONFIG.SPIN_STEP);
  });
  document.getElementById('spin-right').addEventListener('click', () => {
    spinSpeed = Math.min(CONFIG.SPIN_MAX, spinSpeed + CONFIG.SPIN_STEP);
  });
  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => {
    rotationPaused = !rotationPaused;
    if (rotationPaused) tumbleVel.set(0, 0);
    pauseBtn.innerHTML = rotationPaused ? '&#9654;' : '&#10074;&#10074;';
    pauseBtn.title = rotationPaused ? 'Resume rotation' : 'Pause rotation';
  });
  dropBtn.addEventListener('click', dropAll);
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('reset').addEventListener('click', resetAll);

  // Spread pieces outward from the center, or gather them back in.
  // No-op when the melon is whole (nothing to push apart) or during gravity.
  function adjustSpread(sign) {
    if (gravityOn || clusters.length < 2) return;
    for (const cl of clusters) {
      tmpV.copy(cl.targetPos);
      let len = tmpV.length();
      if (len < 0.05) {
        tmpV.copy(midDir(cl.start, cl.count)).applyQuaternion(cl.group.quaternion);
        len = 0.05;
      } else {
        tmpV.divideScalar(len);
      }
      const newLen = Math.max(CONFIG.GATHER_MIN, len + sign * CONFIG.SPREAD_STEP);
      cl.targetPos.copy(tmpV.multiplyScalar(newLen));
    }
  }
  document.getElementById('spread').addEventListener('click', () => adjustSpread(1));
  document.getElementById('gather').addEventListener('click', () => adjustSpread(-1));

  wrapEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetDist = Math.max(MIN_DIST, Math.min(MAX_DIST, targetDist + e.deltaY * 0.004));
  }, { passive: false });

  function worldSphere(cl, idx, out) {
    return out.copy(cl.colliders[idx].p)
      .applyQuaternion(cl.group.quaternion)
      .add(cl.group.position);
  }

  function solveCollisions() {
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 0; i < clusters.length; i++) {
        for (let j = i + 1; j < clusters.length; j++) {
          const A = clusters[i], B = clusters[j];
          if (A.sibling === B && (simTime < A.noCollideUntil || simTime < B.noCollideUntil)) continue;

          for (let ai = 0; ai < A.colliders.length; ai++) {
            worldSphere(A, ai, tmpV2);
            for (let bi = 0; bi < B.colliders.length; bi++) {
              worldSphere(B, bi, tmpV3);
              const rSum = A.colliders[ai].r + B.colliders[bi].r;
              const d = tmpV.copy(tmpV3).sub(tmpV2);
              let dist = d.length();
              if (dist >= rSum - 0.01) continue;
              if (dist < 1e-4) {
                d.set(rand(-1, 1), rand(-0.3, 0.3), rand(-1, 1));
                dist = d.length();
              }
              const n = d.divideScalar(dist);
              const push = (rSum - dist) * 0.3;
              const aHeld = A === grabbed;
              const bHeld = B === grabbed;

              if (!aHeld) {
                const amt = bHeld ? push * 2 : push;
                A.group.position.addScaledVector(n, -amt);
                if (!gravityOn) A.targetPos.addScaledVector(n, -amt);
                A.settled = false;
              }
              if (!bHeld) {
                const amt = aHeld ? push * 2 : push;
                B.group.position.addScaledVector(n, amt);
                if (!gravityOn) B.targetPos.addScaledVector(n, amt);
                B.settled = false;
              }

              if (gravityOn) {
                const relVN = B.vel.dot(n) - A.vel.dot(n);
                if (relVN < 0) {
                  const imp = -relVN * 0.55;
                  if (!aHeld) A.vel.addScaledVector(n, -imp * 0.5);
                  if (!bHeld) B.vel.addScaledVector(n, imp * 0.5);
                }
              }
            }
          }
        }
      }
    }
  }

  function keepInBounds(cl) {
    const bound = BOUND_R[cl.count];
    const p = cl.group.position;
    const horiz = Math.sqrt(p.x * p.x + p.z * p.z);
    const maxH = CONFIG.WORLD_RADIUS - bound;
    if (horiz > maxH) {
      const nx = p.x / horiz, nz = p.z / horiz;
      p.x = nx * maxH;
      p.z = nz * maxH;
      const vRad = cl.vel.x * nx + cl.vel.z * nz;
      if (vRad > 0) {
        cl.vel.x -= nx * vRad * 1.5;
        cl.vel.z -= nz * vRad * 1.5;
      }
      cl.settled = false;
    }
    if (p.y + bound > CONFIG.CEILING_Y) {
      p.y = CONFIG.CEILING_Y - bound;
      if (cl.vel.y > 0) cl.vel.y = -cl.vel.y * 0.4;
    }
  }

  function stepPhysics(cl, dt) {
    if (cl === grabbed || cl.settled) return;
    cl.vel.y -= CONFIG.GRAVITY * dt;
    cl.group.position.addScaledVector(cl.vel, dt);

    let minBottom = Infinity;
    for (let i = 0; i < cl.colliders.length; i++) {
      worldSphere(cl, i, tmpV2);
      minBottom = Math.min(minBottom, tmpV2.y - cl.colliders[i].r);
    }
    let grounded = false;
    const pen = (CONFIG.FLOOR_Y + CONFIG.FLOOR_MARGIN) - minBottom;
    if (pen > 0) {
      cl.group.position.y += pen;
      grounded = true;
      if (cl.vel.y < 0) cl.vel.y = Math.abs(cl.vel.y) > 0.8 ? -cl.vel.y * 0.35 : 0;
      cl.vel.x *= 0.86;
      cl.vel.z *= 0.86;
      cl.angVel.multiplyScalar(0.82);
    }

    keepInBounds(cl);

    const spin = cl.angVel.length();
    if (spin > 1e-4) {
      tmpV.copy(cl.angVel).normalize();
      tmpQ.setFromAxisAngle(tmpV, spin * dt);
      cl.group.quaternion.premultiply(tmpQ);
    }

    if (grounded && cl.vel.length() < 0.05 && spin < 0.25) {
      cl.vel.set(0, 0, 0);
      cl.angVel.set(0, 0, 0);
      cl.settled = true;
    }
  }

  let prev = performance.now();
  let t = 0;

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - prev) / 1000, 0.033);
    prev = now;
    t += dt;
    simTime = t;

    const decay = Math.pow(CONFIG.INERTIA_DECAY, dt * 60);
    const pieceDecay = Math.pow(CONFIG.PIECE_INERTIA_DECAY, dt * 60);

    if (!gravityOn) {
      if (dragMode !== 'tumble' && !rotationPaused) {
        if (tumbleVel.length() > 0.001) {
          applyTumble(tumbleVel.x * dt, tumbleVel.y * dt);
          tumbleVel.multiplyScalar(decay);
        }
        applyTumble(0, spinSpeed * dt);
      }

      for (const cl of clusters) {
        if (cl !== activeCluster && cl.spinVel.length() > 0.001) {
          rotateClusterScreen(cl, cl.spinVel.x * dt, cl.spinVel.y * dt);
          cl.spinVel.multiplyScalar(pieceDecay);
        }
      }

      melonGroup.position.y = Math.sin(t * 1.2) * 0.08;

      const k = 1 - Math.pow(0.002, dt);
      for (const cl of clusters) {
        cl.group.position.lerp(cl.targetPos, k);
      }
      if (clusters.length > 1) solveCollisions();

      const ease = 1 - Math.pow(0.01, dt);
      camYaw += (0 - camYaw) * ease;
      camPitch += (BASE_PITCH - camPitch) * ease;
    } else {
      for (const cl of clusters) stepPhysics(cl, dt);
      if (clusters.length > 1) solveCollisions();

      // Safety pass: collision pushes above can shove a piece below the
      // floor even after it's settled (stepPhysics skips settled pieces).
      // This guarantees nothing ever visibly clips through the floor.
      for (const cl of clusters) {
        if (cl === grabbed) continue;
        let minBottom = Infinity;
        for (let i = 0; i < cl.colliders.length; i++) {
          worldSphere(cl, i, tmpV2);
          minBottom = Math.min(minBottom, tmpV2.y - cl.colliders[i].r);
        }
        const pen = (CONFIG.FLOOR_Y + CONFIG.FLOOR_MARGIN) - minBottom;
        if (pen > 0.0005) {
          cl.group.position.y += pen;
          cl.settled = false;
        }
      }

      if (dragMode !== 'orbit' && !rotationPaused) {
        camYaw += spinSpeed * dt;
      }

      for (const cl of clusters) {
        if (!cl.shadow) continue;
        const p = cl.group.position;
        const bound = BOUND_R[cl.count];
        const h = Math.max(0, p.y - (CONFIG.FLOOR_Y + bound));
        const sc = bound * 2.4 * (1 + h * 0.1);
        cl.shadow.position.x = p.x;
        cl.shadow.position.z = p.z;
        cl.shadow.scale.set(sc, sc * 0.9, 1);
        cl.shadow.material.opacity = Math.max(0.1, 0.55 - h * 0.1);
      }
    }

    // Floor disc fade + main shadow swap
    const fm = floorMesh.material;
    fm.opacity += ((gravityOn ? 1 : 0) - fm.opacity) * (1 - Math.pow(0.02, dt));
    floorMesh.visible = fm.opacity > 0.01;
    shadowMesh.material.opacity = 1 - fm.opacity;
    shadowMesh.visible = shadowMesh.material.opacity > 0.02;

    // Camera: dip spring on drop, smooth look target, orbit
    camDipVel += -camDip * 30 * dt;
    camDipVel *= Math.pow(0.02, dt);
    camDip += camDipVel * dt * 10;
    camLookY += ((gravityOn ? -0.9 : 0) - camLookY) * (1 - Math.pow(0.02, dt));

    camDist += (targetDist - camDist) * (1 - Math.pow(0.001, dt));
    camera.position.set(
      Math.sin(camYaw) * Math.cos(camPitch) * camDist,
      camLookY + Math.sin(camPitch) * camDist + camDip,
      Math.cos(camYaw) * Math.cos(camPitch) * camDist
    );
    camera.lookAt(0, camLookY, 0);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    camera.aspect = wrapEl.clientWidth / wrapEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrapEl.clientWidth, wrapEl.clientHeight);
  });
})();
</script>
</body>
</html>
